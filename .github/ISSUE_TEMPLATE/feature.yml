name: 功能需求
description: 提出一个新功能或改进想法
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 场景
      placeholder: 例：日报里同一个观点被不同视频重复推送
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      placeholder: 例：跨内容按 subject+direction 聚合去重
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 涉及层级
      options:
        - 采集 collectors
        - 提取 extractors
        - 分析 analysis
        - 推送 notifiers / digest
        - 调度 / 部署
        - 文档 / 规范
        - 不确定
    validations:
      required: true
